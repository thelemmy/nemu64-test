[package]
name = "n64-systemtest"
version = "3.0.0"
edition = "2021"

[features]
# The set of tests that should be included by default
default = ["base"]

# This flag controls whether quick tests are included in the test set. It must be true if any quick test is supposed
# to be run (therefore the next features require it).
# For stresstest builds it is useful to not have this on, so those don't require it
quick = []

# This is the basic set of tests. The majority of tests fall into this category
base = ["quick"]

# Tests that requires emulation of accurate time (e.g. a NOP is 0.5 cycles, Random decrements by 1 per instruction).
timing = ["quick"]

# Tests that require a cycle accurate emulator (where for example some parts of an instruction happen in a later cycle
# than the instruction itself). There isn't much test coverage to fully derive the rules yet (and most likely this
# wouldn't be implementable by a dynamic recompiler), so for now this is disabled by default.
cycle = ["quick"]

# Tests that require a cycle accurate emulator (where for example some parts of an instruction happen in a later cycle
# than the instruction itself). There isn't much test coverage to fully derive the rules yet (and most likely this
# wouldn't be implementable by a dynamic recompiler), so for now this is disabled by default.
cop0hazard = ["quick"]

# Tests that show something weird about the hardware where the pattern isn't fully understood. These tests aren't enough
# to implement in an emulator yet. As more tests for a certain quirk are being written (and the understanding grows),
# they'd move out of this category. Therefore, it is disabled by default and not even reported as disabled.
poorly_understood_quirk = ["quick"]

# The filled-triangle RDP tests. Disabled by default because they aren't stable on hardware yet.
experimental_rdp = []

# Renders the currently running test to the screen before it runs, so a hang or panic during
# emulator bringup shows the culprit instead of a black screen. Disabled by default: the per-test
# rendering roughly triples the suite's runtime and has been seen to wedge real hardware mid-run.
live_progress = []

vmulf_stress_test = []
vmulu_stress_test = []
vmulq_stress_test = []
vmudl_stress_test = []
vmudh_stress_test = []
vmudm_stress_test = []
vmudn_stress_test = []
vmacf_stress_test = []
vmacu_stress_test = []
vmadl_stress_test = []
vmadh_stress_test = []
vmadm_stress_test = []
vmadn_stress_test = []
vrcp32_stress_test = []
vrsq32_stress_test = []
rcp_rsq_dump = []
cop1_stress_test = []

[profile.dev]
# Using the default level 0 for this profile, causes rust-lld to throw the error "PC offset is too large" with a 64-bit address.
# This probably occurs because the current architecture target is set as a 32-bit system (attempting to use 64-bit will cause other compiler problems).
opt-level = 1

[profile.release]
# Fat LTO across all crates. This replaces the old -Clinker-plugin-lto (cross-language LTO,
# which bought us nothing: there is no C in the build) and lets rustc emit the final machine
# code itself. That honours the target's +noabicalls feature, so the objects are static/non-PIC
# and rust-lld no longer warns about mixing abicalls with non-abicalls code - and the ROM comes
# out ~1 MB smaller as a bonus.
#
# WARNING: the MIPS backend has been caught MISCOMPILING i64 pair arithmetic (with and without
# LTO, layout-dependent - see the note in rdp-core/src/raster.rs). Avoid i64 in hot new code and
# hardware-verify anything that must use it.
lto = "fat"

[dependencies]
linked_list_allocator = "0.10.5"
spinning_top = "0.2.5" # 0.3 exists, but linked_list_allocator pins 0.2 - staying on one shared copy
arrayref = "0.3.6"
oorandom = { version = "11.1.3", default-features = false }
arbitrary-int = {version = "2.1.1", features = ["num-traits"] }
bitbybit = "2.0.0"
num-traits = { version = "0.2.15", default-features = false }
rdp-core = { path = "rdp-core" }